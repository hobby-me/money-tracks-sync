# sync.example.com → synk на 127.0.0.1:8090. Замените домен на свой и
# выпустите сертификат: certbot --nginx -d sync.example.com
# Метрики (127.0.0.1:8091) сюда не проксируются намеренно.

server {
    server_name sync.example.com;

    # Пачки правок маленькие, фото чеков после пережима — сотни КБ;
    # потолок с запасом.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Токен устройства ходит заголовком — только по https.
    add_header Strict-Transport-Security "max-age=86400" always;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/sync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name sync.example.com;
    listen 80;
    return 301 https://$host$request_uri;
}
